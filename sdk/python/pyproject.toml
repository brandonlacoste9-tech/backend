[project]
name = "myai-client"
version = "0.1.0"
description = "Python client for the Summarise-as-a-Service API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "coverage[toml]>=7.4",
    "requests-mock>=1.11",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["myai_client"]
