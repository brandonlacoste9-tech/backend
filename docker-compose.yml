version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: money_maker
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    healthcheck:
      # Uses ollama CLI (no curl required). Alternative: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Optional: persist models on host
    # volumes: ["ollama_data:/root/.ollama"]

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    env_file:
      - .env
    ports: ["8000:8000"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  worker:
    build: .
    depends_on:
      - redis
      - db
      - ollama
    env_file:
      - .env
    # --pool=solo: single process, clean SIGTERM handling in containers
    command: ["celery", "-A", "app.workers.tasks", "worker", "--loglevel=info", "--pool=solo"]
    restart: unless-stopped

volumes:
  pg_data:
